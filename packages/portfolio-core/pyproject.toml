[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-core"
version = "0.1.0"
description = "Shared financial analytics, Value-at-Risk engines, and database access layer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.0",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "sqlalchemy>=2.1.6",
    "pymysql>=1.2.3",
    "cryptography>=50.0.2",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.4",
    "yfinance>=1.7.0",
    "openpyxl>=3.1.5",
    "tabulate>=0.10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
