services:
  # ---------------------------------------------------------------------------
  # 1. Distributed Dask Scheduler & Worker
  # ---------------------------------------------------------------------------
  dask-scheduler:
    build:
      context: .
      dockerfile: apps/pipeline/Dockerfile
    container_name: portfolio-dask-scheduler
    restart: unless-stopped
    command: ["dask", "scheduler"]
    ports:
      - "8786:8786"
      - "8787:8787"

  dask-worker:
    build:
      context: .
      dockerfile: apps/pipeline/Dockerfile
    container_name: portfolio-dask-worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./apps/pipeline:/opt/dagster/app
      - ./packages/portfolio-core:/packages/portfolio-core
    command: ["dask", "worker", "tcp://dask-scheduler:8786", "--nworkers", "1", "--nthreads", "4", "--memory-limit", "2GB"]
    depends_on:
      - dask-scheduler

  # ---------------------------------------------------------------------------
  # 2. Dagster Orchestration Engine
  # ---------------------------------------------------------------------------
  dagster-pipeline:
    build:
      context: .
      dockerfile: apps/pipeline/Dockerfile
    container_name: portfolio-dagster-pipeline
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./apps/pipeline:/opt/dagster/app
      - ./packages/portfolio-core:/packages/portfolio-core
      - dagster_storage:/opt/dagster/dagster_home
    ports:
      - "3000:3000"
    depends_on:
      - dask-scheduler

  # ---------------------------------------------------------------------------
  # 3. Streamlit Risk & Volatility Analytics Dashboard
  # ---------------------------------------------------------------------------
  risk-dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: portfolio-risk-dashboard
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./apps/dashboard:/app
      - ./packages/portfolio-core:/packages/portfolio-core
    ports:
      - "8501:8501"

volumes:
  dagster_storage:
